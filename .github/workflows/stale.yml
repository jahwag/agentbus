name: Manage stale issues

on:
  schedule:
    - cron: '37 2 * * *'
  workflow_dispatch:

concurrency:
  group: stale-management
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/stale@5bef64f19d7facfb25b37b414482c7164d639639 # v9.1.0
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 30
          days-before-pr-stale: 60
          days-before-pr-close: -1
          stale-issue-message: >-
            This issue has had no activity for 60 days and is now marked stale.
            Comment or remove the stale label within 30 days to keep it open.
          close-issue-message: >-
            This issue was closed after 30 additional days without activity.
            Reopen it if the work becomes active again.
          stale-pr-message: >-
            This pull request has had no activity for 60 days. It will remain
            open, but a comment or new commit will remove the stale label.
          close-issue-reason: not_planned
          exempt-issue-labels: security,pinned,never-stale
          exempt-pr-labels: security,pinned,never-stale
          exempt-all-assignees: true
          exempt-all-milestones: true
          remove-stale-when-updated: true
          operations-per-run: 20
          ascending: true
